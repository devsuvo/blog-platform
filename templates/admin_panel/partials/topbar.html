{% load static %}
<header class="sticky top-0 z-20 flex h-16 items-center gap-3 border-b border-slate-200 bg-white/80 px-4 backdrop-blur dark:border-slate-800 dark:bg-slate-900/80 sm:px-6">
    <button type="button" @click="sidebarOpen = !sidebarOpen" aria-label="Toggle navigation" aria-controls="sidebar"
            class="btn-ghost -ml-2 !px-2 lg:hidden">
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" /></svg>
    </button>

    <div class="min-w-0 flex-1">
        <label for="admin-search" class="sr-only">Search</label>
        <div class="relative max-w-sm">
            <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path stroke-linecap="round" d="M21 21l-4.35-4.35" /></svg>
            <input id="admin-search" type="search" placeholder="Search posts, users… (coming soon)" disabled
                   class="field-input cursor-not-allowed bg-slate-50 pl-9 dark:bg-slate-800/60" />
        </div>
    </div>

    <div class="flex items-center gap-1">
        {% include "partials/dark_mode_toggle.html" %}

        <div class="relative" x-data="{ open: false }">
            <button type="button" @click="open = !open" @click.outside="open = false" aria-label="Notifications" class="btn-ghost !px-2">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 00-4-5.7V5a2 2 0 10-4 0v.3A6 6 0 006 11v3.2a2 2 0 01-.6 1.4L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
            </button>
            <div x-show="open" x-cloak x-transition @click.outside="open = false"
                 class="absolute right-0 z-30 mt-2 w-72 rounded-lg border border-slate-200 bg-white p-3 shadow-lg dark:border-slate-800 dark:bg-slate-900">
                <p class="px-1 py-1 text-sm font-semibold text-slate-900 dark:text-white">Notifications</p>
                <p class="px-1 py-6 text-center text-sm text-slate-500 dark:text-slate-400">No new notifications.</p>
            </div>
        </div>

        <div class="relative ml-1" x-data="{ open: false }">
            <button type="button" @click="open = !open" @click.outside="open = false"
                    class="flex items-center gap-2 rounded-full p-1 hover:bg-slate-100 dark:hover:bg-slate-800">
                {% if request.user.avatar %}
                    <img src="{{ request.user.avatar.url }}" alt="" class="h-8 w-8 rounded-full object-cover">
                {% else %}
                    <span class="flex h-8 w-8 items-center justify-center rounded-full bg-indigo-100 text-sm font-semibold text-indigo-700 dark:bg-indigo-500/20 dark:text-indigo-300">
                        {{ request.user.email|slice:":1"|upper }}
                    </span>
                {% endif %}
                <span class="hidden text-sm font-medium text-slate-700 dark:text-slate-200 sm:block">
                    {{ request.user.get_full_name|default:request.user.email }}
                </span>
            </button>
            <div x-show="open" x-cloak x-transition
                 class="absolute right-0 z-30 mt-2 w-52 overflow-hidden rounded-lg border border-slate-200 bg-white py-1 shadow-lg dark:border-slate-800 dark:bg-slate-900">
                <a href="{% url 'dashboard:profile' %}" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 dark:text-slate-200 dark:hover:bg-slate-800">My profile</a>
                <a href="{% url 'dashboard:profile-password' %}" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 dark:text-slate-200 dark:hover:bg-slate-800">Change password</a>
                <form method="post" action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="block w-full px-4 py-2 text-left text-sm text-red-600 hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-500/10">Sign out</button>
                </form>
            </div>
        </div>
    </div>
</header>
