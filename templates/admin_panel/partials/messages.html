{% if messages %}
<div class="pointer-events-none fixed inset-x-0 top-4 z-50 flex flex-col items-center gap-2 px-4 sm:items-end sm:right-4 sm:left-auto">
    {% for message in messages %}
    <div x-data="{ show: true }" x-show="show" x-init="setTimeout(() => show = false, 6000)" x-transition
         role="status"
         class="pointer-events-auto flex w-full max-w-sm items-start gap-3 rounded-lg border p-4 shadow-lg
         {% if message.tags == 'success' %} border-green-200 bg-green-50 text-green-800 dark:border-green-900 dark:bg-green-500/10 dark:text-green-300
         {% elif message.tags == 'error' %} border-red-200 bg-red-50 text-red-800 dark:border-red-900 dark:bg-red-500/10 dark:text-red-300
         {% elif message.tags == 'warning' %} border-amber-200 bg-amber-50 text-amber-800 dark:border-amber-900 dark:bg-amber-500/10 dark:text-amber-300
         {% else %} border-slate-200 bg-white text-slate-800 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-200
         {% endif %}">
        <p class="flex-1 text-sm">{{ message }}</p>
        <button type="button" @click="show = false" aria-label="Dismiss" class="shrink-0 text-current opacity-60 hover:opacity-100">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}
