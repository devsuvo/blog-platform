<dialog id="{{ modal_id }}" class="w-full max-w-md rounded-lg border border-slate-200 bg-white p-0 shadow-xl backdrop:bg-slate-900/50 dark:border-slate-800 dark:bg-slate-900">
    <form method="post" action="{{ action_url }}">
        {% csrf_token %}
        {% if extra_field_name %}<input type="hidden" name="{{ extra_field_name }}" value="{{ extra_field_value }}">{% endif %}
        <div class="p-6">
            <h2 class="text-lg font-semibold text-slate-900 dark:text-white">{{ title }}</h2>
            <p class="mt-2 text-sm text-slate-600 dark:text-slate-400">{{ body }}</p>
        </div>
        <div class="flex justify-end gap-3 border-t border-slate-200 px-6 py-4 dark:border-slate-800">
            <button type="button" onclick="document.getElementById('{{ modal_id }}').close()" class="btn-secondary">Cancel</button>
            <button type="submit" class="{{ confirm_class|default:'btn-danger' }}">{{ confirm_label|default:"Confirm" }}</button>
        </div>
    </form>
</dialog>
