{% if breadcrumbs %}
<nav aria-label="Breadcrumb" class="mb-4">
    <ol class="flex flex-wrap items-center gap-1 text-sm text-slate-500 dark:text-slate-400">
        <li><a href="{% url 'dashboard:index' %}" class="hover:text-slate-700 dark:hover:text-slate-200">Dashboard</a></li>
        {% for label, url in breadcrumbs %}
            <li aria-hidden="true">/</li>
            <li>
                {% if url %}
                    <a href="{{ url }}" class="hover:text-slate-700 dark:hover:text-slate-200">{{ label }}</a>
                {% else %}
                    <span class="font-medium text-slate-700 dark:text-slate-200" aria-current="page">{{ label }}</span>
                {% endif %}
            </li>
        {% endfor %}
    </ol>
</nav>
{% endif %}
