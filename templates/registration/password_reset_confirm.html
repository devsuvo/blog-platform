{% extends "base.html" %}
{% block title %}Set a new password{% endblock %}
{% block content %}
<h1>Set a new password</h1>
{% if validlink %}
<form method="post">
    {% csrf_token %}
    {{ form.new_password1 }}
    {{ form.new_password2 }}
    <button type="submit">Change password</button>
</form>
{% else %}
<p>This password reset link is invalid or has expired.</p>
{% endif %}
{% endblock %}
