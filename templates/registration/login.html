{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if form.errors %}
<p style="color:#b91c1c;">Your email or password was incorrect.</p>
{% endif %}
<form method="post">
    {% csrf_token %}
    <p>
        <label for="id_username">Email</label><br>
        <input type="email" name="username" id="id_username" autofocus required>
    </p>
    <p>
        <label for="id_password">Password</label><br>
        <input type="password" name="password" id="id_password" required>
    </p>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Sign in</button>
</form>
<p><a href="{% url 'accounts:password_reset' %}">Forgot your password?</a></p>
{% endblock %}
