{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<h1>Reset your password</h1>
<p>Enter your email address and we will send you a link to reset your password.</p>
<form method="post">
    {% csrf_token %}
    {{ form.email }}
    <button type="submit">Send reset link</button>
</form>
{% endblock %}
