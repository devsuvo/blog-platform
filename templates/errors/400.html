{% extends "public/base.html" %}
{% block title %}400 — Bad request · {{ SITE_NAME }}{% endblock %}
{% block breadcrumbs %}{% endblock %}
{% block content %}
<section class="mx-auto flex max-w-xl flex-col items-center px-4 py-24 text-center sm:px-6">
    <p class="text-sm font-semibold uppercase tracking-widest text-indigo-600 dark:text-indigo-400">400</p>
    <h1 class="mt-3 text-3xl font-bold text-slate-900 sm:text-4xl dark:text-white">
        That request couldn't be understood.
    </h1>
    <p class="mt-3 text-slate-500 dark:text-slate-400">Please check the URL and try again.</p>
    <div class="mt-8 flex flex-wrap justify-center gap-3">
        <a href="{% url 'public:home' %}" class="btn-primary">Go home</a>
    </div>
</section>
{% endblock %}
